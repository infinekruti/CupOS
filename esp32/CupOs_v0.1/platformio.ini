[platformio]
src_dir = CupOS

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    madhephaestus/ESP32Servo@^3.0.5
    vshymanskyy/TinyGSM@^0.11.7
    bblanchon/ArduinoJson@^7.0.4
    arduino-libraries/ArduinoHttpClient@^0.6.0
